name: Build OutGrow WhatsApp Validator Ultra for macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub website

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG and ZIP
        run: |
          if [ ! -f "main.js" ]; then
            echo "Showcase build detected. Preparing packaging entrypoint..."
            cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          app.whenReady().then(() => {
            const win = new BrowserWindow({
              width: 1280,
              height: 850,
              title: "OutGrow WhatsApp Validator Ultra",
              icon: path.join(__dirname, 'public/app-icon.png')
            });
            win.loadFile(path.join(__dirname, 'public/index.html'));
          });
          EOF
            touch server.js validator.js sheets_sync.js
          fi
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OutGrow-WhatsApp-Validator-Ultra-macOS
          path: |
            dist/*.dmg
            dist/*.zip
